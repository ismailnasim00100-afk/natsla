<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NATSLA | تسجيل الدخول</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #05070d;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #0b101a;
    border: 1px solid #17243a;
    border-radius: 20px;
    padding: 35px 25px;
    box-shadow: 0 0 40px rgba(0, 119, 255, 0.12);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #008cff;
}

.subtitle {
    text-align: center;
    color: #aab4c5;
    margin-bottom: 30px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #dce5f2;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 18px;
    border: 1px solid #263750;
    border-radius: 12px;
    background: #070b13;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #008cff;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #168ff0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.create {
    text-align: center;
    margin-top: 22px;
    color: #9eabc0;
}

.create a {
    color: #168ff0;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        N<span>ATSLA</span>
    </div>

    <p class="subtitle">مستقبلك التجاري يبدأ هنا ⚡</p>

    <h1>تسجيل الدخول 🔐</h1>

    <form onsubmit="login(event)">

        <label>البريد الإلكتروني</label>
        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
        >

        <label>كلمة المرور</label>
        <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
        >

        <button type="submit">
            دخول 🚀
        </button>

    </form>

    <div class="create">
        ما عندك حساب؟
        <a href="create-store.html">إنشاء حساب جديد</a>
    </div>

</div>

<script>
function login(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email && password) {
        window.location.href = "create-store.html";
    }
}
</script>

</body>
</html>
